{% extends "layout.html" %}

{% block title %}Edit {{ book.title }}{% endblock %}

{% block body %}
    <div class="max-w-2xl mx-auto">
        <div class="mb-6">
            <a href="{{ url_for('library.book_detail', book_id=book.id) }}" class="inline-flex items-center gap-2 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-sky-600 dark:hover:text-sky-400 transition-colors">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Book Details</span>
            </a>
        </div>

        <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl shadow-slate-200/40 dark:shadow-none p-6 sm:p-10">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-11 h-11 rounded-2xl bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Edit Book</h1>
                    <p class="text-sm text-slate-500 dark:text-slate-400">Update book metadata or upload a new cover.</p>
                </div>
            </div>

            <form method="post" enctype="multipart/form-data" class="space-y-5">
                <div>
                    <label for="title" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Title</label>
                    <input type="text" required name="title" value="{{ book.title }}" placeholder="Title" id="title"
                           class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label for="author" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Author</label>
                        <input type="text" required name="author" value="{{ book.author }}" placeholder="Author" id="author"
                               class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all">
                    </div>
                    <div>
                        <label for="published_date" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Published Date</label>
                        <input type="date" required name="published_date" value="{{ book.published_date }}" id="published_date"
                               class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all">
                    </div>
                </div>

                <div>
                    <label for="image" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Cover Image (optional)</label>
                    <input type="file" name="image" id="image" accept=".png,.jpg,.jpeg"
                           class="block w-full text-sm text-slate-500 dark:text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-sky-50 dark:file:bg-sky-950 file:text-sky-700 dark:file:text-sky-300 hover:file:bg-sky-100 dark:hover:file:bg-sky-900 border border-slate-200 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950 cursor-pointer">
                    <p class="mt-1.5 text-xs text-slate-400">Leave empty to keep the current cover. Accepted: JPEG, JPG or PNG.</p>
                </div>

                <div>
                    <label for="description" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Description</label>
                    <textarea id="description" name="description" rows="4"
                              class="w-full p-4 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all">{{ book.description or '' }}</textarea>
                </div>

                <div class="pt-3 flex items-center justify-end gap-3">
                    <a href="{{ url_for('library.book_detail', book_id=book.id) }}" class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">Cancel</a>
                    <button type="submit" class="px-6 py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-sm font-semibold shadow-md shadow-sky-600/20 active:scale-95 transition-all inline-flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>Save Changes</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
