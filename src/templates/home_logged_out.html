{% extends "layout.html" %}

{% block title %}Welcome{% endblock %}

{% block body %}
    <div class="relative rounded-3xl bg-gradient-to-r from-sky-900 via-indigo-900 to-slate-900 text-white p-8 sm:p-16 overflow-hidden shadow-xl shadow-sky-950/10 my-6">
        <div class="absolute -right-10 -bottom-10 w-72 h-72 bg-sky-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute right-1/3 -top-10 w-72 h-72 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="relative z-10 max-w-2xl">
            <span class="px-3 py-1 text-xs font-semibold bg-sky-500/20 text-sky-300 border border-sky-400/30 rounded-full uppercase tracking-wider">Digital Library</span>
            <h1 class="text-3xl sm:text-5xl font-extrabold mt-4 tracking-tight leading-tight">Discover, Borrow &amp; Manage Books Effortlessly</h1>
            <p class="text-slate-300 text-base sm:text-lg mt-4 leading-relaxed">Sign in or create an account to browse the library collection, check book availability, and borrow your next read.</p>

            <div class="flex flex-wrap items-center gap-4 mt-8">
                <a href="{{ url_for('auth.login') }}" class="px-6 py-3 bg-sky-500 hover:bg-sky-400 text-white font-semibold text-sm rounded-2xl shadow-lg shadow-sky-500/25 transition-all active:scale-95 inline-flex items-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Login</span>
                </a>
                <a href="{{ url_for('auth.register') }}" class="px-6 py-3 bg-white/10 hover:bg-white/20 text-white border border-white/20 font-semibold text-sm rounded-2xl backdrop-blur-md transition-all active:scale-95 inline-flex items-center gap-2">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Create Account</span>
                </a>
            </div>
        </div>
    </div>
{% endblock %}
