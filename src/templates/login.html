{% extends "layout.html" %}

{% block title %}Login{% endblock %}

{% block body %}
    <div class="max-w-md mx-auto my-8 sm:my-14">
        <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-none p-8 sm:p-10">
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-sky-500/20 mx-auto mb-4">
                    <i class="fa-solid fa-book-open text-xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Welcome back</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Sign in to your AuraLib account</p>
            </div>

            <form method="post" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Username</label>
                    <input type="text" required name="username" placeholder="Enter your username" id="username"
                           class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all">
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
                    <input type="password" required name="password" placeholder="••••••••" id="password"
                           class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all">
                </div>

                <button type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-semibold text-sm shadow-md shadow-sky-600/20 active:scale-95 transition-all">
                    Login
                </button>
            </form>

            <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}" class="font-semibold text-sky-600 dark:text-sky-400 hover:underline">Register</a>
            </p>
        </div>
    </div>
{% endblock %}
