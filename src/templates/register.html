{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block body %}
    <div class="max-w-md mx-auto my-6 sm:my-10">
        <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl shadow-slate-200/50 dark:shadow-none p-8 sm:p-10">
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-sky-500/20 mx-auto mb-4">
                    <i class="fa-solid fa-user-plus text-xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Create Account</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Join the AuraLib digital library</p>
            </div>

            <form method="post" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="firstname" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">First Name</label>
                        <input type="text" required name="firstname" placeholder="First name" id="firstname"
                               class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all">
                    </div>
                    <div>
                        <label for="lastname" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Last Name</label>
                        <input type="text" required name="lastname" placeholder="Last name" id="lastname"
                               class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all">
                    </div>
                </div>

                <div>
                    <label for="username" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Username</label>
                    <input type="text" required name="username" placeholder="Choose a username" id="username"
                           class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all">
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
                    <input type="password" required name="password" placeholder="••••••••" id="password"
                           class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all">
                </div>

                <div>
                    <label for="registercode" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Register Code</label>
                    <input type="text" required name="registercode" placeholder="Enter invite code" id="registercode"
                           class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all">
                </div>

                <button type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-semibold text-sm shadow-md shadow-sky-600/20 active:scale-95 transition-all mt-2">
                    Register
                </button>
            </form>

            <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
                Already have an account?
                <a href="{{ url_for('auth.login') }}" class="font-semibold text-sky-600 dark:text-sky-400 hover:underline">Login</a>
            </p>
        </div>
    </div>
{% endblock %}
